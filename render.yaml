# Render Blueprint — "New +" -> "Blueprint" orqali ikkala xizmat va baza
# bir vaqtda yaratiladi. Hammasi bepul (free) rejada.
#
# MUHIM: quyidagi "saidislomxoja-shabbona-api" nomi band bo'lsa, Render manzilga qo'shimcha
# qo'shadi (masalan saidislomxoja-shabbona-api-x7k2.onrender.com). Deploydan keyin backend
# manzilini tekshirib, pastdagi rewrite destination'ni shunga moslang.

databases:
  - name: saidislomxoja-shabbona-db
    plan: free
    databaseName: taklifnoma
    user: taklifnoma

services:
  # ---------- Django API ----------
  - type: web
    name: saidislomxoja-shabbona-api
    runtime: python
    plan: free
    rootDir: deploy_ready/config
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      # Django 5.0 rasman 3.12 gacha qo'llab-quvvatlaydi; psycopg2-binary ham
      # 3.12 uchun tayyor "wheel" ga ega — shuning uchun versiya qat'iy belgilangan.
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: saidislomxoja-shabbona-db
          property: connectionString
      # Bepul tarifda Shell yo'q, shuning uchun admin foydalanuvchi build
      # paytida shu qiymatlardan yaratiladi. sync: false -> Render Blueprint
      # yaratilayotganda qiymatni sizdan so'raydi (repo'da saqlanmaydi).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ---------- React sayt (static) ----------
  # Static site hech qachon "uxlamaydi" — mehmon uchun sahifa darhol ochiladi.
  - type: web
    name: saidislomxoja-shabbona
    runtime: static
    rootDir: wedding_react
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # /api so'rovlari backendga uzatiladi — shu sabab sayt va API bir domenda
      # ko'rinadi va CORS umuman kerak bo'lmaydi.
      - type: rewrite
        source: /api/*
        destination: https://saidislomxoja-shabbona-api.onrender.com/api/*
      # SPA: qolgan barcha manzillar index.html ga
      - type: rewrite
        source: /*
        destination: /index.html
